name: Source verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-source-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout revision
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "Source verification directly exercised repository Head: $actual"
      - name: Verify PHP CLI availability
        run: php --version
      - name: Run canonical verification
        run: php tests/verify.php
      - name: Falsify unbounded output-buffer cleanup in isolated PHP processes
        run: python3 tests/production-candidate/test-buffer-guard.py
