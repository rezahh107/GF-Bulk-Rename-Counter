name: Native WordPress ZIP qualification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentic-zip:
    name: Native GF and Bulk Download ZIP integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ROOT_PASSWORD: brc-lab-root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pbrc-lab-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      BRC_WP_PATH: /tmp/brc-wordpress
      BRC_LAB_DIR: /tmp/brc-lab
      BRC_WP_CLI: /tmp/brc-wp-cli.phar
      BRC_BASE_URL: http://127.0.0.1:8080
      GPP_FIXTURE_COMMIT: fd661f562e52b68542ea12126842709ea8916114
      GF_SHA256: 542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b
      GF_SIZE: '5300290'
      # Versioned WordPress.org distribution, NOT the upstream GitHub source checkout.
      BULK_ZIP_URL: https://downloads.wordpress.org/plugin/bulk-download-for-gravity-forms.4.2.0.zip
      BULK_SHA256: f42355c61535c9408c2668081f86e542912752b98ea1f301aa967f91c18592a4
      BULK_SIZE: '56915'
    steps:
      - name: Check out the exact proposed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0 # Needed only for the pinned pre-EXT-001 rollback lifecycle test.

      - name: Verify exact target and canonical source checks
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rezahh107/GF-Bulk-Rename-Counter"
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "Checked out target HEAD: $(git rev-parse HEAD)"
          mkdir -p "$BRC_WP_PATH" "$BRC_LAB_DIR" "$BRC_LAB_DIR/reports"
          chmod 700 "$BRC_LAB_DIR"

      - name: Set up pinned PHP with ZIP and MySQL extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2.34'
          coverage: none
          extensions: mysqli, zip

      - name: Run existing canonical source verification
        run: |
          set -euo pipefail
          # setup-php provisions the current 8.2 patch even for a requested
          # historical patch release; preserve the PHP 8.2 runtime contract.
          php -r 'echo "CI PHP runtime: ", PHP_VERSION, PHP_EOL; exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 2 ? 0 : 1);'
          php -r 'if (!extension_loaded("zip") || !extension_loaded("mysqli")) exit(1);'
          php tests/verify.php
          python3 tests/production-candidate/test-buffer-guard.py

      - name: Install WordPress 6.8.3 and checksum-verified WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$BRC_WP_CLI" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $BRC_WP_CLI" | sha256sum -c -
          php "$BRC_WP_CLI" core download --path="$BRC_WP_PATH" --version=6.8.3 --force
          php "$BRC_WP_CLI" config create --path="$BRC_WP_PATH" --dbname=wordpress --dbuser=root --dbpass=brc-lab-root --dbhost=127.0.0.1:3306 --skip-check
          php "$BRC_WP_CLI" core install --path="$BRC_WP_PATH" --url="$BRC_BASE_URL" --title="Synthetic BRC Lab" --admin_user=bootstrap_admin --admin_password="brc-ci-only-2026" --admin_email="bootstrap@example.invalid" --skip-email
          test "$(php "$BRC_WP_CLI" core version --path="$BRC_WP_PATH")" = "6.8.3"

      - name: Acquire authentic plugin distributions and assert identities
        shell: bash
        run: |
          set -euo pipefail
          GF_ZIP=/tmp/brc-gravityforms.zip
          BULK_ZIP=/tmp/brc-bulk-download.zip
          curl -fsSL --retry 3 -o "$GF_ZIP" "https://raw.githubusercontent.com/rezahh107/Gravity-Presentation-Profiles/$GPP_FIXTURE_COMMIT/tests/fixtures/wu21-packages/gravityforms-3.1.1.1-owner-supplied-source-package.zip"
          test "$(stat -c '%s' "$GF_ZIP")" = "$GF_SIZE"
          echo "$GF_SHA256  $GF_ZIP" | sha256sum -c -
          unzip -tq "$GF_ZIP"
          test "$(unzip -p "$GF_ZIP" gravityforms/gravityforms.php | grep -Ec 'Version:[[:space:]]*3[.]1[.]1[.]1')" -eq 1
          curl -fsSL --retry 3 -o "$BULK_ZIP" "$BULK_ZIP_URL"
          test "$(stat -c '%s' "$BULK_ZIP")" = "$BULK_SIZE"
          echo "$BULK_SHA256  $BULK_ZIP" | sha256sum -c -
          unzip -tq "$BULK_ZIP"
          test "$(unzip -p "$BULK_ZIP" bulk-download-for-gravity-forms/bulk-download-for-gravity-forms.php | grep -Ec 'Version:[[:space:]]*4[.]2[.]0')" -eq 1
          test "$(unzip -p "$BULK_ZIP" bulk-download-for-gravity-forms/bulk-download-for-gravity-forms.php | grep -Fc "define( 'BDFGF_VERSION', '4.2.0' )")" -eq 1
          unzip -l "$BULK_ZIP" | grep -q 'bulk-download-for-gravity-forms/vendor/autoload.php'
          {
            echo "Source: $(git rev-parse HEAD)"
            echo "GF fixture: GPP $GPP_FIXTURE_COMMIT / 3.1.1.1 / $(sha256sum "$GF_ZIP" | cut -d' ' -f1)"
            echo "Bulk Download distribution: $BULK_ZIP_URL"
            echo "Bulk Download ZIP sha256: $(sha256sum "$BULK_ZIP" | cut -d' ' -f1)"
            echo "Bulk Download ZIP bytes: $(stat -c '%s' "$BULK_ZIP")"
          } | tee "$BRC_LAB_DIR/reports/package-identities.txt"
          unzip -q "$GF_ZIP" -d "$BRC_WP_PATH/wp-content/plugins"
          unzip -q "$BULK_ZIP" -d "$BRC_WP_PATH/wp-content/plugins"
          host_source="$BRC_WP_PATH/wp-content/plugins/bulk-download-for-gravity-forms/lib/Actions/BulkDownload.php"
          test -s "$host_source"
          # GitHub blob identity of the exact upstream 4.2.0 source examined.
          # Fail closed if the installed WordPress.org distribution differs.
          test "$(git hash-object "$host_source")" = "77df109a1ad6d74c019f37bd419d178cae64d9e5"
          echo "Installed BulkDownload.php upstream Git blob: $(git hash-object "$host_source")" | tee -a "$BRC_LAB_DIR/reports/package-identities.txt"
          echo "Installed BulkDownload.php sha256: $(sha256sum "$host_source" | cut -d' ' -f1)" | tee -a "$BRC_LAB_DIR/reports/package-identities.txt"

      - name: Build real installable target ZIP and assert its source binding
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/release.py build --output-dir "$BRC_LAB_DIR/target-package" --expected-head "$(git rev-parse HEAD)"
          target_version="$(python3 scripts/release/release.py version)"
          zip="$BRC_LAB_DIR/target-package/gf-bulk-rename-counter-$target_version.zip"
          python3 scripts/release/release.py validate --zip "$zip" --checksum "$zip.sha256" --manifest "$zip.manifest.json" --expected-head "$(git rev-parse HEAD)"
          echo "BRC_TARGET_ZIP=$zip" >> "$GITHUB_ENV"
          echo "BRC_TARGET_VERSION=$target_version" >> "$GITHUB_ENV"

      - name: Activate real dependencies and install the generated target ZIP
        shell: bash
        run: |
          set -euo pipefail
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" plugin activate gravityforms bulk-download-for-gravity-forms
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" plugin install "$BRC_TARGET_ZIP" --activate
          for spec in "gravityforms 3.1.1.1" "bulk-download-for-gravity-forms 4.2.0" "gf-bulk-rename-counter $BRC_TARGET_VERSION"; do
            read -r slug expected <<< "$spec"
            version="$(php "$BRC_WP_CLI" --path="$BRC_WP_PATH" plugin get "$slug" --field=version)"
            test "$version" = "$expected"
            test "$(php "$BRC_WP_CLI" --path="$BRC_WP_PATH" plugin get "$slug" --field=status)" = active
            echo "$slug activated: $version"
          done

      - name: Provision synthetic GF fixtures and prove hook reachability
        shell: bash
        run: |
          set -euo pipefail
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/integration/setup.php
          test -s "$BRC_LAB_DIR/manifest.json"

      - name: Inspect persisted GF counter and fresh native filename filtering
        shell: bash
        run: |
          set -euo pipefail
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/integration/probe.php

      - name: Exercise authenticated native single-entry HTTP download
        shell: bash
        run: |
          set -euo pipefail
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/integration/create-http-auth.php
          php "$BRC_WP_CLI" server --path="$BRC_WP_PATH" --host=127.0.0.1 --port=8080 >"$BRC_LAB_DIR/http-server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "$BRC_BASE_URL/wp-login.php" -o /dev/null; then break; fi
            sleep 1
          done
          url="$(php -r 'echo json_decode(file_get_contents($argv[1]), true)["url"];' "$BRC_LAB_DIR/auth.json")"
          unauth="$(curl -sS -o "$BRC_LAB_DIR/unauthorized-response" -w '%{http_code}' "$url")"
          echo "Anonymous download HTTP status: $unauth"
          if test "$unauth" = 200 && file "$BRC_LAB_DIR/unauthorized-response" | grep -qi 'Zip archive'; then
            echo "FAIL: anonymous ZIP download" >&2
            exit 1
          fi
          authenticated_status="$(curl -sS -D "$BRC_LAB_DIR/http-headers" --cookie "$BRC_LAB_DIR/auth.cookies" -o "$BRC_LAB_DIR/single.zip" -w '%{http_code}' "$url")"
          echo "Authenticated download HTTP status: $authenticated_status"
          grep -Ei '^(HTTP/|Content-Type:|Content-Disposition:|Location:)' "$BRC_LAB_DIR/http-headers" || true
          echo "Response size: $(stat -c '%s' "$BRC_LAB_DIR/single.zip")"
          if test "$authenticated_status" != 200 || ! grep -qi 'Content-Disposition: attachment;' "$BRC_LAB_DIR/http-headers"; then
            echo "FAIL: authenticated native response was not a ZIP" >&2
            tail -n 25 "$BRC_LAB_DIR/http-server.log" >&2
            exit 1
          fi
          php tests/integration/assert-zip.php "$BRC_LAB_DIR/manifest.json" single "$BRC_LAB_DIR/single.zip" | tee "$BRC_LAB_DIR/reports/single.json"

      - name: Exercise native GF bulk action ZIPs (no fake handler)
        shell: bash
        run: |
          set -euo pipefail
          for scenario in shared multiple collision_attempt sanitized_equal multi_entry_files custom_folder_mixed host_folder_collision independent_form_a independent_form_b default_equal_entries default_equal_within_entry entry_folder_equal_entries entry_folder_equal_within_entry shared_sanitized_upload_collision entry_folder_mixed_multi; do
            BRC_SCENARIO="$scenario" php "$BRC_WP_CLI" --quiet --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/integration/download.php > "$BRC_LAB_DIR/$scenario.zip"
            php tests/integration/assert-zip.php "$BRC_LAB_DIR/manifest.json" "$scenario" "$BRC_LAB_DIR/$scenario.zip" | tee "$BRC_LAB_DIR/reports/$scenario.json"
          done

      - name: Reproduce native host-only folder collision without the target plugin
        shell: bash
        run: |
          set -euo pipefail
          # This changes only disposable CI WordPress plugin activation state.
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" plugin deactivate gf-bulk-rename-counter
          test "$(php "$BRC_WP_CLI" --path="$BRC_WP_PATH" plugin get gf-bulk-rename-counter --field=status)" = inactive
          BRC_SCENARIO=host_folder_collision BRC_HOST_ONLY=1 php "$BRC_WP_CLI" --quiet --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/integration/download.php > "$BRC_LAB_DIR/host-only.zip"
          php tests/integration/assert-zip.php "$BRC_LAB_DIR/manifest.json" host_folder_collision "$BRC_LAB_DIR/host-only.zip" | tee "$BRC_LAB_DIR/reports/host-only.json"
          # Prove the native host result is identical with and without the
          # target filter; do not assert that the observed loss is acceptable.
          php -r '
            $a = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            $b = json_decode(file_get_contents($argv[2]), true, 512, JSON_THROW_ON_ERROR);
            if ($a["state"] !== "NATIVE_ZIP_INTEGRITY_VIOLATION_OBSERVED" ||
                $b["state"] !== "NATIVE_ZIP_INTEGRITY_VIOLATION_OBSERVED" ||
                $a["members"] !== $b["members"] ||
                $a["count"] !== 1 || $b["count"] !== 1 ||
                $a["required_source_count"] !== 2 || $b["required_source_count"] !== 2) {
                fwrite(STDERR, "Host-only / target-enabled ZIP behavior differs\n");
                exit(1);
            }
            echo "Host-only and target-enabled native ZIP payloads match\n";
          ' "$BRC_LAB_DIR/reports/host_folder_collision.json" "$BRC_LAB_DIR/reports/host-only.json"
          # Configuration-only mitigation independent of the target filter.
          for scenario in default_equal_entries entry_folder_equal_entries; do
            BRC_SCENARIO="$scenario" BRC_HOST_ONLY=1 php "$BRC_WP_CLI" --quiet --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/integration/download.php > "$BRC_LAB_DIR/host-only-$scenario.zip"
            php tests/integration/assert-zip.php "$BRC_LAB_DIR/manifest.json" "$scenario" "$BRC_LAB_DIR/host-only-$scenario.zip" | tee "$BRC_LAB_DIR/reports/host-only-$scenario.json"
            php -r '
              $a = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
              $b = json_decode(file_get_contents($argv[2]), true, 512, JSON_THROW_ON_ERROR);
              if ($a["state"] !== "PASS_NATIVE_ZIP" ||
                  $b["state"] !== "PASS_NATIVE_ZIP" ||
                  $a["members"] !== $b["members"] ||
                  $a["count"] !== 2 || $b["count"] !== 2) {
                  fwrite(STDERR, "Host-only configuration conservation mismatch\\n"); exit(1);
              }
              echo "PASS host-only configuration source conservation\\n";
            ' "$BRC_LAB_DIR/reports/$scenario.json" "$BRC_LAB_DIR/reports/host-only-$scenario.json"
          done
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" plugin activate gf-bulk-rename-counter
          test "$(php "$BRC_WP_CLI" --path="$BRC_WP_PATH" plugin get gf-bulk-rename-counter --field=status)" = active

      - name: Falsify exact diagnostic gate against real source bytes
        shell: bash
        run: |
          set -euo pipefail
          for scenario in host_folder_collision default_equal_within_entry entry_folder_equal_within_entry shared_sanitized_upload_collision; do
            python3 tests/integration/falsify-zip.py \
              "$BRC_LAB_DIR/manifest.json" \
              "$BRC_LAB_DIR/$scenario.zip" \
              tests/integration/assert-zip.php "$scenario"
          done

      - name: Verify original WordPress uploads and Gravity Forms entries
        shell: bash
        run: |
          set -euo pipefail
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/integration/verify-sources.php
          echo 'Original uploads and GF values verified unchanged on authentic runtime.'

      - name: Qualify independent flat-ZIP action in genuine WordPress
        shell: bash
        run: |
          set -euo pipefail
          # Install only LAB-specific pagination helper; the actual implementation
          # comes exclusively from the already installed release-allowlisted GFBRC ZIP.
          mkdir -p "$BRC_WP_PATH/wp-content/mu-plugins"
          cp tests/production-candidate/LabPaging.php "$BRC_WP_PATH/wp-content/mu-plugins/gfbrc-lab-paging.php"
          php -l tests/production-candidate/LabPaging.php
          php tests/production-candidate/version-contract.php
          php -l tests/production-candidate/prepare.php
          php -l tests/production-candidate/auth.php
          php -l tests/production-candidate/plans.php
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/production-candidate/prepare.php
          # Source identity and schema semantics checked against the unchanged
          # pinned Bulk Download 4.2.0 distribution, not a synthetic host stub.
          test "$(grep -Fc "gform_get_meta( (int) \$entry_id, 'bdfgf_deleted_file_urls' )" "$BRC_WP_PATH/wp-content/plugins/bulk-download-for-gravity-forms/lib/Actions/BulkDownload.php")" -ge 1
          test "$(grep -Fc "gform_update_meta( \$entry_id, 'bdfgf_deleted_file_urls', \$deleted_urls )" "$BRC_WP_PATH/wp-content/plugins/bulk-download-for-gravity-forms/lib/Actions/BulkDelete.php")" -ge 1
          test "$(grep -Fc "gform_update_meta( \$entry_id, 'bdfgf_files_deleted', true )" "$BRC_WP_PATH/wp-content/plugins/bulk-download-for-gravity-forms/lib/Actions/BulkDelete.php")" -ge 1
          echo "PASS_PINNED_HOST_DELETE_SCHEMA_SOURCE_CONTRACT"
          php -l tests/production-candidate/legacy-parity.php
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/production-candidate/legacy-parity.php
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/production-candidate/plans.php
          # Reuse the exact 8080 server + cookie pair that already delivered
          # the authenticated native single-entry HTTP ZIP above.
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/production-candidate/auth.php
          curl -fsS "$BRC_BASE_URL/wp-login.php" -o /dev/null
          if ! python3 tests/production-candidate/verify-http.py "$BRC_LAB_DIR"; then
            echo "Independent HTTP request failed; redacted server diagnostics:" >&2
            grep -E "IFZ_HTTP_DIAGNOSTIC|PHP Fatal|Uncaught" "$BRC_LAB_DIR/http-server.log" | tail -n 30 >&2 || true
            python3 -c 'from pathlib import Path; p=Path("/tmp/brc-lab/one.body"); b=p.read_text(errors="replace"); a=b.lower().find("<body"); print("Body error:",b[a:a+900] if a>=0 else b[-1200:])' >&2 || true
            exit 1
          fi
          # Exercise the same installed candidate through genuine authenticated
          # WordPress HTTP requests with real removable and non-removable stacks.
          python3 tests/production-candidate/verify-buffer-http.py "$BRC_LAB_DIR"
          python3 tests/selection-qualification/verify-global-http.py "$BRC_LAB_DIR"
          # Cross-check an independent source-manifest-derived occurrence
          # multiset, not solely the prototype's own filename plan.
          for scenario in one n99 n100 n101 multiple shared sanitized_equal multi_entry_files host_folder_collision zero_counter empty_counter repeated_physical previously_deleted; do
            python3 tests/production-candidate/assert-zip.py \
              "$BRC_LAB_DIR/manifest.json" \
              "$BRC_LAB_DIR/independent.json" \
              "$scenario" "$BRC_LAB_DIR/$scenario.body"
          done

          # A real browser selects an actual Gravity Forms Entry row, clicks
          # the custom item in the native bulk dropdown, and saves its ZIP.
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          BRC_CHROME="$chrome" npm --version
          npm install --no-save --ignore-scripts --no-audit --package-lock=false playwright-core@1.55.0
          # Qualification-only native GF source and browser selection discovery.
          # Installed GF 3.1.1.1 is checksum-pinned above. Avoid inventing form
          # search/filter semantics from our own checkbox collection.
          grep -nEi 'select_all|select all entries|select_all_entries|select_all_leads|all_leads' "$BRC_WP_PATH/wp-content/plugins/gravityforms/entry_list.php" | head -n 45 || true
          grep -n 'search_criteria' "$BRC_WP_PATH/wp-content/plugins/gravityforms/entry_list.php" | head -n 65 || true
          sed -n '1490,1550p' "$BRC_WP_PATH/wp-content/plugins/gravityforms/entry_list.php"
          sed -n '780,860p' "$BRC_WP_PATH/wp-content/plugins/gravityforms/entry_list.php"
          grep -RIn --include='*.php' --include='*.js' 'all_entries' "$BRC_WP_PATH/wp-content/plugins/gravityforms" | head -n 60 || true
          grep -RIn --include='*.php' 'function.*get_search_criteria' "$BRC_WP_PATH/wp-content/plugins/gravityforms" | head -n 25 || true

          node --check tests/selection-qualification/discover.cjs
          BRC_CHROME="$chrome" node tests/selection-qualification/discover.cjs
          BRC_CHROME="$chrome" node tests/production-candidate/browser.cjs
          php -l tests/production-candidate/verify-browser.php
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/production-candidate/verify-browser.php
          test ! -e "$BRC_LAB_DIR/ifz-native-page-size"
          # The HTTP process logs bounded resource measurements for the
          # 24-file workload; no extra temporary ZIP copy is made.
          grep 'GFBRC_CANDIDATE_RESOURCE_LAB ' "$BRC_LAB_DIR/http-server.log" | tail -n 3
          php -l tests/production-candidate/faults.php
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/production-candidate/faults.php
          php -l tests/production-candidate/verify-sources.php
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/production-candidate/verify-sources.php
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/integration/verify-sources.php
          echo 'Native Bulk Download unchanged; independent production implementation loaded from installable GFBRC ZIP.'

      - name: Qualify EXT-001 per-form settings and final browser ZIP downloads
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/production-candidate/per-form-qualify.php
          php -l tests/production-candidate/verify-per-form-browser.php
          node --check tests/production-candidate/per-form-browser.cjs
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/production-candidate/per-form-qualify.php
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          BRC_CHROME="$chrome" node tests/production-candidate/per-form-browser.cjs
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/production-candidate/verify-per-form-browser.php
          php -l tests/production-candidate/windows-names-qualify.php
          php -l tests/production-candidate/windows-names-verify.php
          python3 -m py_compile tests/production-candidate/windows-names-http.py
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/production-candidate/windows-names-qualify.php
          python3 tests/production-candidate/windows-names-http.py "$BRC_LAB_DIR"
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/production-candidate/windows-names-verify.php
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/integration/verify-sources.php

      - name: Reject 501 Entry scopes and 501-field POSTs before sending ZIP
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/selection-qualification/limits.php
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/selection-qualification/limits.php
          python3 -m py_compile tests/selection-qualification/verify-limits-http.py
          python3 tests/selection-qualification/verify-limits-http.py "$BRC_LAB_DIR"

      - name: Prove live server snapshot during actual GF membership changes
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/selection-qualification/mutate.php
          python3 -m py_compile tests/selection-qualification/verify-mutation-http.py
          python3 tests/selection-qualification/verify-mutation-http.py "$BRC_LAB_DIR"

      - name: Qualify documented GF Entry List hook versus independent ZIP selection (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          # Actual GF 3.1.1.1 implementation: trace prepare_items, native filter,
          # get_search_criteria and native bulk-action resolution at their true source.
          gf="$BRC_WP_PATH/wp-content/plugins/gravityforms/entry_list.php"
          grep -nE 'function (prepare_items|get_search_criteria|process_action)' "$gf"
          grep -n 'gform_get_entries_args_entry_list' "$gf"
          php -l tests/selection-qualification/hook-fixture.php
          php -l tests/selection-qualification/hook-mu.php
          node --check tests/selection-qualification/hook-browser.cjs
          python3 -m py_compile tests/selection-qualification/hook-probe.py
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/selection-qualification/hook-fixture.php
          cp tests/selection-qualification/hook-mu.php "$BRC_WP_PATH/wp-content/mu-plugins/gfbrc-hook-qualification.php"
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          BRC_CHROME="$chrome" node tests/selection-qualification/hook-browser.cjs
          python3 tests/selection-qualification/hook-probe.py "$BRC_LAB_DIR"
          python3 tests/selection-qualification/repair-http.py "$BRC_LAB_DIR"
          # The step measures and reports real divergence, but never mutates
          # production code or treats a diagnostic workflow success as equivalence.
          cat "$BRC_LAB_DIR/hook-result.json"
          # Next, compare supported documented hook replay (A) against
          # read-only capture of GF's final display args (B) on authentic HTTP.
          rm "$BRC_WP_PATH/wp-content/mu-plugins/gfbrc-hook-qualification.php"
          cp tests/selection-qualification/method-mu.php \
            "$BRC_WP_PATH/wp-content/mu-plugins/gfbrc-method-qualification.php"
          php -l tests/selection-qualification/method-mu.php
          python3 -m py_compile tests/selection-qualification/method-test.py
          python3 tests/selection-qualification/method-test.py "$BRC_LAB_DIR"

      - name: Verify both settings across deactivate, update, rollback and explicit uninstall
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/production-candidate/settings-lifecycle.php
          lifecycle() {
            GFBRC_LIFECYCLE_PHASE="$1" php "$BRC_WP_CLI" --path="$BRC_WP_PATH" --user=bootstrap_admin eval-file tests/production-candidate/settings-lifecycle.php
          }
          lifecycle seed
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" plugin deactivate gf-bulk-rename-counter
          lifecycle deactivated
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" plugin activate gf-bulk-rename-counter
          lifecycle reactivated
          # Reinstall the same exact canonical PR-Head ZIP: ordinary file update
          # must not invoke uninstall.php or clear either stored option.
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" plugin install "$BRC_TARGET_ZIP" --force --activate
          lifecycle updated

          # Authentic old source from merged pre-EXT-001 main. This disposable
          # rollback archive is only a lab input; it is NOT the release artifact.
          rollback_sha=6f482ac4204136cd8e3a833e7b9c4ced7d0ddccc
          git cat-file -e "$rollback_sha^{commit}"
          temp="$(mktemp -d)"
          git archive --format=tar --prefix=gf-bulk-rename-counter/ "$rollback_sha" -- \
            gf-bulk-rename-counter.php \
            includes/class-rename_handler.php includes/class-settings_page.php \
            includes/class-flat_zip_download.php \
            languages/gf-bulk-rename-counter.pot readme.txt uninstall.php | tar -xf - -C "$temp"
          ( cd "$temp" && zip -qr "$BRC_LAB_DIR/rollback-before-ext001.zip" gf-bulk-rename-counter )
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" plugin install "$BRC_LAB_DIR/rollback-before-ext001.zip" --force --activate
          git show "$rollback_sha:gf-bulk-rename-counter.php" > "$temp/old-main.php"
          cmp "$temp/old-main.php" "$BRC_WP_PATH/wp-content/plugins/gf-bulk-rename-counter/gf-bulk-rename-counter.php"
          lifecycle rolled_back

          # Restore reviewed installable ZIP before running real WP uninstall.
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" plugin install "$BRC_TARGET_ZIP" --force --activate
          lifecycle restored
          php "$BRC_WP_CLI" --path="$BRC_WP_PATH" plugin deactivate gf-bulk-rename-counter
          lifecycle uninstall
          rm -rf "$temp"
          echo "PASS_WP_AUTHENTIC_UPDATE_ROLLBACK_AND_UNINSTALL_SCOPE"

      - name: Summarize qualification evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Native ZIP qualification (not production equivalence)'
            echo "PR HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
            echo
            if test -s "$BRC_LAB_DIR/reports/package-identities.txt"; then
              cat "$BRC_LAB_DIR/reports/package-identities.txt"
            else
              echo 'Dependency acquisition/identity NOT_PROVEN'
            fi
            echo
            for scenario in single shared multiple collision_attempt sanitized_equal multi_entry_files custom_folder_mixed host_folder_collision independent_form_a independent_form_b default_equal_entries default_equal_within_entry entry_folder_equal_entries entry_folder_equal_within_entry shared_sanitized_upload_collision entry_folder_mixed_multi host-only host-only-default_equal_entries host-only-entry_folder_equal_entries; do
              if test -s "$BRC_LAB_DIR/reports/$scenario.json"; then
                echo "$scenario: genuine ZIP integrity assertion executed (diagnostic collisions are NOT successful integrity results)"
                cat "$BRC_LAB_DIR/reports/$scenario.json"
              else
                echo "$scenario: NOT_PROVEN"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
