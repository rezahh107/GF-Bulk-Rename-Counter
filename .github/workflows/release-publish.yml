name: Owner-authorized production publication

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PUBLISH only after reviewing and merging the qualified candidate PR"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: brc-owner-release-operation
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirmation == 'PUBLISH' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRC_ADMIN_READ_TOKEN: ${{ secrets.BRC_RELEASE_ADMIN_READ_TOKEN }}
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ROOT_PASSWORD: brc-consumer-ci-only
          MARIADB_DATABASE: wordpress
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pbrc-consumer-ci-only --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2.34'
          extensions: zip, mysqli
          coverage: none
      - name: Fail closed on unverified platform, history, candidate or CI
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rezahh107/GF-Bulk-Rename-Counter"
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$BRC_ADMIN_READ_TOKEN"
          curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $BRC_ADMIN_READ_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/immutable-releases" | jq -e '.enabled == true' >/dev/null
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test -f release/candidate.json
          v="$(jq -er '.version' release/candidate.json)"
          intent="$(jq -er '.intent' release/candidate.json)"
          branch="$(jq -er '.branch' release/candidate.json)"
          base="$(jq -er '.base.commit' release/candidate.json)"
          test "$branch" = "release-candidate/v$v"
          test "$v" = "$(python3 scripts/release/release.py version)"
          git merge-base --is-ancestor "$base" "$GITHUB_SHA"
          test -z "$(git ls-remote --tags origin "refs/tags/v$v")"
          if gh release view "v$v" >/dev/null 2>&1; then exit 1; fi
          mapfile -t tags < <(git tag -l 'v*' | LC_ALL=C sort)
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate > "$RUNNER_TEMP/release-pages.json"
          jq -s 'add' "$RUNNER_TEMP/release-pages.json" > "$RUNNER_TEMP/releases.json"
          python3 scripts/release/release.py history --tags "${tags[@]}" --releases-file "$RUNNER_TEMP/releases.json" --candidate-version "$v"
          git worktree add --detach "$RUNNER_TEMP/release-base" "$base"
          planned="$(python3 scripts/release/release.py plan --root "$RUNNER_TEMP/release-base" --intent "$intent" --tags "${tags[@]}")"
          test "$planned" = "$v"
          gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" --paginate --jq '.[] | select(.merged_at != null)' > "$RUNNER_TEMP/merged.jsonl"
          jq -s --arg branch "$branch" '[.[] | select(.head.ref == $branch and .base.ref == "main")]' "$RUNNER_TEMP/merged.jsonl" > "$RUNNER_TEMP/matched.json"
          test "$(jq 'length' "$RUNNER_TEMP/matched.json")" -eq 1
          reviewed="$(jq -er '.[0].head.sha' "$RUNNER_TEMP/matched.json")"
          pr="$(jq -er '.[0].number' "$RUNNER_TEMP/matched.json")"
          git fetch origin "refs/pull/$pr/head"
          test "$(git rev-parse FETCH_HEAD)" = "$reviewed"
          python3 scripts/release/release.py bind --reviewed "$reviewed" --integrated "$GITHUB_SHA"
          for workflow in release-dry-run.yml native-zip-integration.yml; do
            successful="$(gh run list --workflow "$workflow" --branch "$branch" --limit 100 --json headSha,conclusion,event --jq "[.[] | select(.headSha == \"$reviewed\" and .event == \"workflow_dispatch\" and .conclusion == \"success\")] | length")"
            test "$successful" -gt 0 || { echo "Candidate qualification absent: $workflow" >&2; exit 1; }
          done
          echo "BRC_VERSION=$v" >> "$GITHUB_ENV"
          echo "BRC_TAG=v$v" >> "$GITHUB_ENV"
          echo "Reviewed exact candidate $reviewed from PR #$pr matches integrated tree." >> "$GITHUB_STEP_SUMMARY"
      - name: Build final exact-source ZIP, checksum and manifest
        run: |
          set -euo pipefail
          php tests/verify.php
          python3 -m unittest discover -s tests/release -p 'test_*.py' -v
          python3 scripts/release/release.py build --output-dir "$RUNNER_TEMP/release" --expected-head "$GITHUB_SHA"
      - name: Publish immutable draft with already tested artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git ls-remote --tags origin "refs/tags/$BRC_TAG")"
          if gh release view "$BRC_TAG" >/dev/null 2>&1; then exit 1; fi
          z="$RUNNER_TEMP/release/gf-bulk-rename-counter-$BRC_VERSION.zip"
          python3 scripts/release/release.py validate --zip "$z" --checksum "$z.sha256" --manifest "$z.manifest.json" --expected-head "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$BRC_TAG" -m "Reviewed $BRC_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$BRC_TAG"
          gh release create "$BRC_TAG" --verify-tag --draft --title "$BRC_TAG" --notes "Qualified and reviewed source: $GITHUB_SHA" "$z" "$z.sha256" "$z.manifest.json"
          gh release edit "$BRC_TAG" --draft=false
      - name: Verify downloaded consumer artifact and activate in fresh real WordPress
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/consumer"
          mkdir -p "$dest"
          zname="gf-bulk-rename-counter-$BRC_VERSION.zip"
          gh release verify "$BRC_TAG"
          gh release download "$BRC_TAG" --dir "$dest" --pattern "$zname" --pattern "$zname.sha256" --pattern "$zname.manifest.json"
          cmp "$RUNNER_TEMP/release/$zname" "$dest/$zname"
          cmp "$RUNNER_TEMP/release/$zname.sha256" "$dest/$zname.sha256"
          cmp "$RUNNER_TEMP/release/$zname.manifest.json" "$dest/$zname.manifest.json"
          gh release verify-asset "$BRC_TAG" "$dest/$zname"
          python3 scripts/release/release.py validate --zip "$dest/$zname" --checksum "$dest/$zname.sha256" --manifest "$dest/$zname.manifest.json" --expected-head "$GITHUB_SHA"
          test "$(git ls-remote --tags origin "refs/tags/$BRC_TAG^{}" | cut -f1)" = "$GITHUB_SHA"
          bash scripts/release/consumer-smoke.sh "$dest/$zname" "$BRC_VERSION"
      - name: Retire candidate marker only after successful last-mile check
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm release/candidate.json
          git commit -m "chore(release): retire consumed $BRC_TAG candidate marker"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          gh release verify "$BRC_TAG"
          echo "PUBLISHED_AND_CONSUMER_VERIFIED: $BRC_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Report partial failure without rewriting a tag or asset
        if: failure()
        run: echo "Inspect GitHub tag/Release, including drafts, before any retry. Never overwrite or automatically roll back published history. Owner decision required for partial publication." >> "$GITHUB_STEP_SUMMARY"
