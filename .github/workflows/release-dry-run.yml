name: Release contract and installable ZIP dry-run

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Exact-source release dry-run (no publication)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind checkout to event source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2.34'
          extensions: zip
          coverage: none
      - name: Existing source verification
        run: php tests/verify.php
      - name: Validate gettext POT syntax and exact translatable source coverage
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext
          catalog=languages/gf-bulk-rename-counter.pot
          msgfmt --check -o /dev/null "$catalog"
          tmp="$(mktemp -d)"
          xgettext --language=PHP --from-code=UTF-8 --omit-header \
            --keyword= --keyword=__ --keyword=esc_html__ --keyword=esc_html_e \
            --keyword=esc_attr__ --keyword=esc_attr_e \
            --output="$tmp/extracted.pot" \
            gf-bulk-rename-counter.php includes/*.php
          msgfmt --check -o /dev/null "$tmp/extracted.pot"
          msgcomm --unique --omit-header --no-location \
            --output="$tmp/unmatched.pot" "$catalog" "$tmp/extracted.pot"
          if grep -q '^msgid "' "$tmp/unmatched.pot"; then
            echo 'POT does not match current PHP gettext messages:' >&2
            cat "$tmp/unmatched.pot" >&2
            exit 1
          fi
          echo 'PASS_GETTEXT_POT_PARSE_AND_EXACT_SOURCE_MSGID_SET'
      - name: Release mutation/contract regression suite
        run: python3 -m unittest discover -s tests/release -p 'test_*.py' -v
      - name: Canonical package, metadata and checksum dry-run
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/release.py build --output-dir "$RUNNER_TEMP/brc-release" --expected-head "$(git rev-parse HEAD)"
          v="$(python3 scripts/release/release.py version)"
          base="$RUNNER_TEMP/brc-release/gf-bulk-rename-counter-$v.zip"
          python3 scripts/release/release.py validate --zip "$base" --checksum "$base.sha256" --manifest "$base.manifest.json" --expected-head "$(git rev-parse HEAD)"
          unzip -tq "$base"
          echo "Non-production ZIP and manifest for exact source $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve review artifact (never a GitHub Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brc-installable-dry-run
          path: ${{ runner.temp }}/brc-release/
          if-no-files-found: error
          retention-days: 7
